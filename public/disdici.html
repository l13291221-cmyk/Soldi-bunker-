<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chiudi il tuo abbonamento — Nerodoro Studio</title>
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230b0b0d'/><circle cx='50' cy='50' r='38' fill='none' stroke='%23d6b16a' stroke-width='3'/><text x='50' y='66' font-size='46' text-anchor='middle' font-family='Georgia' fill='%23d6b16a'>N</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .pay-wrap { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 48px 16px; }
    .pay-card { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 30px; box-shadow: 0 40px 90px -40px #000; }
    .pay-card input { width: 100%; margin: 0 0 10px; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .big { font-family: var(--serif); font-size: 1.6rem; margin: 6px 0 14px; }
    .quote { margin: 8px 0 0; padding: 12px 14px; border-left: 3px solid var(--gold-2); background: var(--bg-2); border-radius: 0 10px 10px 0; font-size: .9rem; }
    .accept { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; font-size: .92rem; cursor: pointer; }
    .accept input { width: 20px; height: 20px; flex: none; margin: 2px 0 0; }
  </style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a href="/" class="brand"><span class="brand-mark">N</span>Nerodoro Studio</a>
    <span class="muted small">Chiudi abbonamento</span>
  </div>
</header>

<main class="pay-wrap">
  <div class="pay-card fade-in" id="card"></div>
</main>

<script src="/common.js"></script>
<script>
  const card = document.getElementById('card');
  const params = new URLSearchParams(location.search);
  let code = '', email = '';
  const dateIt = iso => iso ? new Date(iso).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

  // 1. Codice ordine ed email usata per pagare
  function askCode(err) {
    card.innerHTML = `
      <span class="kicker">Chiudi il tuo abbonamento</span>
      <h2 style="font-size:1.6rem;margin:8px 0 6px">Inserisci il tuo codice</h2>
      <p class="muted" style="margin:0 0 16px">È il codice che hai ricevuto quando hai attivato il sito (es. K7M2-P9QX), più l'email che hai usato per pagare.</p>
      <form id="f" autocomplete="off">
        <input id="code" class="code-input" placeholder="XXXX-XXXX" maxlength="9" required autocapitalize="characters" spellcheck="false" value="${escapeHtml(code || params.get('codice') || '')}">
        <input id="email" type="email" placeholder="Email usata per pagare" autocomplete="email" inputmode="email" required value="${escapeHtml(email)}">
        <button class="btn btn-gold" style="width:100%">Continua</button>
        <p class="err" id="err" style="margin:10px 0 0">${escapeHtml(err || '')}</p>
      </form>
      <p class="muted small" style="margin:16px 0 0">Hai perso il codice? Scrivici su WhatsApp e te lo rimandiamo.</p>`;
    const ci = document.getElementById('code');
    ci.addEventListener('input', () => {
      const raw = ci.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
      ci.value = raw.length > 4 ? raw.slice(0, 4) + '-' + raw.slice(4) : raw;
    });
    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      code = ci.value.replace(/[^A-Z0-9]/gi, '').toUpperCase();
      email = document.getElementById('email').value.trim();
      const r = await fetch('/api/orders/' + encodeURIComponent(code) + '/disdetta').catch(() => null);
      const d = r ? await r.json().catch(() => ({})) : {};
      if (!r || !r.ok) return askCode(d.error || 'Errore di connessione, riprova.');
      showSummary(d);
    });
  }

  // 2. Quanto manca al vincolo, cosa aveva accettato, casella e conferma
  function showSummary(d, err) {
    const p = d.penalty, money = c => formatMoney(c, d.currency);
    card.innerHTML = `
      <span class="kicker">Chiudi il tuo abbonamento</span>
      <h2 style="font-size:1.6rem;margin:8px 0 2px">${escapeHtml(d.restaurant)}</h2>
      <p class="muted small" style="margin:0 0 10px">Codice ${escapeHtml(d.code)} · ${money(d.monthly)} al mese</p>
      ${p.recesso ? `<div class="big">Sei entro i 14 giorni di recesso</div>`
        : p.months > 0 ? `<div class="big">Ti mancano <b>${p.months} mesi</b> alla fine del vincolo</div>`
        : `<div class="big">Il tuo vincolo è finito</div>`}
      <div class="row"><span class="muted">Attivato il</span><span>${dateIt(d.paidAt)}</span></div>
      ${d.months > 1 ? `<div class="row"><span class="muted">Vincolo</span><span>${d.months} mesi, fino al ${dateIt(d.commitmentEnd)}</span></div>` : ''}
      <div class="row"><span class="muted">Ti verrà addebitato</span><span><b>${money(p.amount)}</b>${p.months ? ` (${p.months} × ${money(d.monthly)})` : ''}</span></div>
      ${d.accepted.text ? `
      <p class="muted small" style="margin:16px 0 0">Quando hai pagato la prima volta${d.accepted.at ? ', il ' + new Date(d.accepted.at).toLocaleString('it-IT') : ''}, hai accettato le <a href="/condizioni" target="_blank" rel="noopener" style="color:var(--gold-2)">condizioni</a> e spuntato questa frase:</p>
      <div class="quote">«${escapeHtml(d.accepted.text)}»</div>` : ''}
      <p class="small" style="margin:18px 0 0;color:${p.amount ? 'var(--red)' : 'var(--muted)'}">${p.amount
        ? `Se continui, ti verranno addebitati in automatico sulla tua carta i ${p.months} mesi restanti del vincolo: ${money(p.amount)}.`
        : 'Se continui, l\'abbonamento si chiude e non ti viene addebitato altro.'}</p>
      <label class="accept"><input type="checkbox" id="ok"><span>${escapeHtml(d.text)}</span></label>
      <button class="btn btn-danger" id="go" style="width:100%" disabled>Continua e chiudi</button>
      <p class="err" id="err" style="margin:10px 0 0;text-align:center">${escapeHtml(err || '')}</p>
      <p class="muted small" style="margin:14px 0 0;text-align:center"><a href="/" style="color:var(--gold-2)">No, tengo il mio sito</a></p>`;
    const ok = document.getElementById('ok'), go = document.getElementById('go');
    ok.addEventListener('change', () => { go.disabled = !ok.checked; });
    go.addEventListener('click', async () => {
      go.disabled = true; go.textContent = 'Attendi…';
      const r = await fetch('/api/orders/' + encodeURIComponent(code) + '/disdici', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, confirm: true, accept: ok.checked, amount: p.amount }),
      }).catch(() => null);
      const res = r ? await r.json().catch(() => ({})) : {};
      if (res.order) return done(d, p);
      if (r && r.status === 400 && /email/i.test(res.error || '')) return askCode(res.error);
      showSummary(d, res.error || 'Errore di connessione, riprova.');
    });
  }

  // 3. Fatto
  function done(d, p) {
    card.style.textAlign = 'center';
    card.innerHTML = `
      <div class="success-ic">✓</div>
      <span class="badge ok">Abbonamento chiuso</span>
      <h2 style="font-size:1.6rem;margin:16px 0 8px">${escapeHtml(d.restaurant)}</h2>
      <p class="muted">${p.amount ? `Ti abbiamo addebitato ${formatMoney(p.amount, d.currency)} per i mesi restanti del vincolo. ` : ''}Il tuo abbonamento è chiuso e il sito verrà messo offline. Grazie per essere stato con noi!</p>`;
  }

  askCode();
</script>
</body>
</html>
