# Backup di ordini, siti pronti e sveglia siti del sito su Render.
# Ogni 5 minuti (il minimo che GitHub permette) scarica i dati (già cifrati dal sito) e li salva sul ramo backup-dati.
# I dati del bot WhatsApp (contatti già scritti e collegamento) vanno sul ramo backup-bot, che tiene solo l'ultima copia:
# cambiano a ogni messaggio e con la cronologia il repository crescerebbe di continuo.
# Non serve nessuna chiave: usa il permesso che GitHub Actions dà già a questo repository.
# Per salvare subito (es. prima di un Manual Deploy): Actions → Backup dati → Run workflow.
name: Backup dati

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-dati

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://nerodoro-studio.onrender.com
    steps:
      - name: Scarica i dati cifrati dal sito
        run: |
          mkdir -p out
          # Render gratuito può dormire o riavviarsi: ritenta per qualche minuto
          curl -fsS --retry 8 --retry-delay 20 --retry-all-errors --max-time 90 "$SITE/api/backup-export" -o export.json
          node -e '
            const d = require("./export.json"), fs = require("fs");
            const names = Object.keys(d.files || {});
            if (!names.length) { console.error("Risposta senza file"); process.exit(1); }
            for (const n of names) { if (!/^[\w.-]+\.enc\.json$/.test(n)) process.exit(1); fs.writeFileSync("out/" + n, d.files[n]); }
            console.log("File:", names.join(", "));
          '

      - name: Salva sul ramo backup-dati
        run: |
          git init -q b && cd b
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin backup-dati; then git checkout -q -B backup-dati FETCH_HEAD; else git checkout -q --orphan backup-dati; fi
          mkdir -p backup && cp ../out/*.enc.json backup/
          git add backup
          if git diff --cached --quiet; then echo "Nessuna modifica"; exit 0; fi
          git -c user.name="backup-dati" -c user.email="backup-dati@users.noreply.github.com" commit -qm "Backup $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q origin backup-dati

      - name: Scarica i dati del bot WhatsApp
        run: |
          mkdir -p outbot
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 "$SITE/api/backup-export?set=bot" -o bot.json || { echo "Bot: niente da salvare"; exit 0; }
          node -e '
            const d = require("./bot.json"), fs = require("fs");
            if (d.set !== "bot") { console.log("Il sito non ha ancora il bot: salto"); process.exit(0); }
            for (const n of Object.keys(d.files || {})) { if (!/^[\w.-]+\.enc\.json$/.test(n)) process.exit(1); fs.writeFileSync("outbot/" + n, d.files[n]); }
          '

      - name: Salva sul ramo backup-bot (solo l'ultima copia)
        run: |
          [ -n "$(ls outbot)" ] || exit 0
          git init -q c && cd c
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin backup-bot 2>/dev/null && git checkout -q FETCH_HEAD -- backup 2>/dev/null && diff -rq backup ../outbot >/dev/null; then echo "Nessuna modifica"; exit 0; fi
          git checkout -q --orphan backup-bot
          git rm -rqf --cached . 2>/dev/null || true
          rm -rf backup && mkdir -p backup && cp ../outbot/*.enc.json backup/
          git add backup
          git -c user.name="backup-dati" -c user.email="backup-dati@users.noreply.github.com" commit -qm "Bot $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -qf origin backup-bot
